name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gradebot
          POSTGRES_USER: gradebot
          # Throwaway credential for a database that exists only for this job.
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradebot -d gradebot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gradebot:ci-only@localhost:5432/gradebot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      # The tests create their own schema from db/schema.sql. With CI set, an
      # unreachable database is an error rather than a skip.
      - name: Test
        run: pytest -q

      - name: Eval gate
        run: python -m evals.run_eval --threshold 0.8
